[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "1.0.0"
description = "Agent 超级工具集 — 两三百个实用 CLI 命令，一个入口"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]
all = ["pytest>=8.0", "pytest-cov>=4.0", "cryptography>=42.0", "PyYAML>=6.0"]

[project.scripts]
at = "agent_tools:main"
agent-tools = "agent_tools:main"

[tool.setuptools.packages.find]
include = ["agent_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]